site_name: pysystemtrade Documentation
site_description: A navigable local guide to pysystemtrade

theme:
  name: material
  language: en
  custom_dir: overrides
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true
      slugify: !!python/name:docs.build_hooks.github_slugify

hooks:
  - docs/build_hooks.py

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Introduction: introduction.md
  - Research and backtesting:
      - Backtesting: backtesting.md
      - Instruments: instruments.md
      - Data: data.md
      - Futures product pages: list_of_futures_product_pages.md
  - Live trading:
      - Interactive Brokers: IB.md
      - Production: production.md
      - Dashboard and monitor: dashboard_and_monitor.md
      - Production strategy changes: production_strategy_changes.md
